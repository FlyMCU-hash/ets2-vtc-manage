[package]
name = "peak-center"
version = "4.0.2"
description = "Peak 车队中心"
authors = ["Peak"]
edition = "2021"
default-run = "peak-center"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:decrypt_truck", "dep:windows", "dep:base64"]
server = ["dep:sqlx", "dep:argon2", "dep:rand", "dep:base64", "dep:axum", "dep:tokio"]

[lib]
name = "peak_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "peak-center"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "peak-server"
path = "src/bin/server.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }
decrypt_truck = { version = "1.3", optional = true }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "mysql", "chrono"] }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net"] }
windows = { version = "0.58", optional = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
