[package]
name = "peak-center"
version = "4.1.1"
description = "Peak 车队中心"
authors = ["Peak"]
edition = "2021"
default-run = "peak-center"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater", "dep:decrypt_truck", "dep:windows", "dep:base64"]

[lib]
name = "peak_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "peak-center"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }
decrypt_truck = { version = "1.3", optional = true }
base64 = { version = "0.22", optional = true }
windows = { version = "0.58", optional = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
